[project]
name = "car-compare"
version = "0.1.0"
description = "Car Compare et le pont Azurz (Dust, Azure DevOps, Ignition)"
readme = "README.md"
authors = [
    { name = "Sebastien CHAULET", email = "sebastien.chaulet@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
    "mcp>=2.3.0",
    "httpx>=0.28.1",
    "behave>=1.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "behave>=1.2.6",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
car-compare = "car_compare.main:main"
azurz = "azurz.main:main"
azurz-azdo = "azurz.labazdo.app:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["car_compare", "azurz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
