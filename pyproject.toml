[project]
name = "car-compare"
version = "0.1.0"
description = "Outil d'aide à l'achat/location de voiture"
readme = "README.md"
authors = [
    { name = "Sebastien CHAULET", email = "sebastien.chaulet@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "behave>=1.2.6",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.scripts]
car-compare = "car_compare.main:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
