<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azure DevOps</title>
  <style>
    :root {
      --blue: #0078d4; --blue-dark: #106ebe; --soft: #deecf9;
      --text: #323130; --muted: #605e5c; --line: #edebe9; --page: #faf9f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--text); background: #fff;
      font-family: "Segoe UI", "Segoe UI Web", sans-serif;
    }
    header {
      height: 48px; display: flex; align-items: center; gap: 16px;
      padding: 0 16px; border-bottom: 1px solid var(--line); background: #fff;
    }
    .mark { width: 24px; height: 24px; background: linear-gradient(135deg, #0078d4 0 50%, #50e6ff 50%); }
    .brand { font-weight: 600; }
    .crumb { color: var(--muted); }
    .crumb strong { color: var(--text); font-weight: 600; }
    header form { margin-left: auto; }
    button.page { background: transparent; border: 0; color: var(--blue); font: inherit; cursor: pointer; padding: 4px 0; }
    header button, .command button, .panel button {
      height: 32px; border: 1px solid transparent; background: var(--blue); color: #fff;
      font: inherit; padding: 0 12px; cursor: pointer;
    }
    header button { background: #fff; color: var(--text); border-color: #8a8886; }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 48px); }
    nav { background: var(--page); border-right: 1px solid var(--line); padding: 12px 0 24px; }
    nav .group { margin: 14px 16px 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
    nav a {
      display: block; padding: 7px 16px 7px 22px; color: var(--text); text-decoration: none;
      border-left: 3px solid transparent;
    }
    nav a:hover { background: #f3f2f1; }
    nav a.active { background: var(--soft); border-left-color: var(--blue); color: var(--blue); font-weight: 600; }
    main { padding: 16px 24px 40px; min-width: 0; }
    h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; }
    .sub { color: var(--muted); margin: 0 0 16px; }
    .command { display: flex; gap: 8px; align-items: center; margin: 8px 0 16px; flex-wrap: wrap; }
    input, select, textarea {
      height: 32px; border: 1px solid #8a8886; padding: 0 8px; font: inherit; background: #fff;
    }
    textarea { height: auto; padding: 8px; width: min(720px, 100%); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: 12px; color: var(--muted); font-weight: 600; }
    tr.click { cursor: pointer; }
    tr.click:hover { background: #f3f2f1; }
    .pill {
      display: inline-block; min-width: 72px; text-align: center; padding: 2px 8px;
      border-radius: 2px; color: #fff; font-size: 12px; background: #666;
    }
    .state-new { background: #6b6b6b; }
    .state-active { background: #007acc; }
    .state-resolved { background: #d83b01; }
    .state-closed { background: #107c10; }
    .type { font-size: 12px; font-weight: 600; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 12px; align-items: start; }
    .col { background: var(--page); border: 1px solid var(--line); min-height: 240px; }
    .col h2 { margin: 0; padding: 10px 12px; font-size: 14px; border-bottom: 1px solid var(--line); }
    .form { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; }
    .form h3 { margin: 0 0 8px; font-size: 16px; }
    .card { margin: 8px; background: #fff; border: 1px solid var(--line); padding: 8px 10px; cursor: grab; }
    .col.drop { outline: 2px solid var(--blue); }
    .card:hover { border-color: var(--blue); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .tile { border: 1px solid var(--line); padding: 14px 16px; background: #fff; text-decoration: none; color: inherit; }
    .tile b { display: block; font-size: 28px; color: var(--blue); }
    .panel { margin-top: 16px; border: 1px solid var(--line); background: #fff; padding: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .error { color: #a4262c; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      nav { display: flex; overflow: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav .group { display: none; }
      nav a { white-space: nowrap; }
      .board { grid-template-columns: 1fr; }
      .form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body data-org="__ORG__" data-project="__PROJECT__" data-user="__USER__">
  <header>
    <div class="mark" aria-hidden="true"></div>
    <div class="brand">Azure DevOps</div>
    <div class="crumb" id="crumb"></div>
    <form method="post" action="/_signout"><button type="submit">Se déconnecter</button></form>
  </header>
  <div class="layout">
    <nav>
      <a href="/__ORG__/__PROJECT__">Vue d'ensemble</a>
      <div class="group">Boards</div>
      <a href="/__ORG__/__PROJECT__/_workitems">Éléments de travail</a>
      <a href="/__ORG__/__PROJECT__/_boards">Tableaux</a>
      <a href="/__ORG__/__PROJECT__/_backlogs">Backlogs</a>
      <a href="/__ORG__/__PROJECT__/_sprints">Sprints</a>
      <a href="/__ORG__/__PROJECT__/_queries">Requêtes</a>
      <div class="group">Dépôts</div>
      <a href="/__ORG__/__PROJECT__/_git">Fichiers</a>
      <a href="/__ORG__/__PROJECT__/_git/commits">Commits</a>
      <a href="/__ORG__/__PROJECT__/_git/pushes">Poussées</a>
      <a href="/__ORG__/__PROJECT__/_git/branches">Branches</a>
      <a href="/__ORG__/__PROJECT__/_git/pulls">Demandes de tirage</a>
      <a href="/__ORG__/__PROJECT__/_tfvc">TFVC</a>
      <div class="group">Pipelines</div>
      <a href="/__ORG__/__PROJECT__/_build">Pipelines</a>
      <a href="/__ORG__/__PROJECT__/_environments">Environnements</a>
      <a href="/__ORG__/__PROJECT__/_release">Versions</a>
      <a href="/__ORG__/__PROJECT__/_library">Bibliothèque</a>
      <div class="group">Plans de test</div>
      <a href="/__ORG__/__PROJECT__/_testPlans">Plans de test</a>
      <a href="/__ORG__/__PROJECT__/_testPlans/runs">Exécutions</a>
      <div class="group">Artefacts</div>
      <a href="/__ORG__/__PROJECT__/_artifacts">Artefacts</a>
      <a href="/__ORG__/__PROJECT__/_wiki">Wiki</a>
      <a href="/__ORG__/__PROJECT__/_settings">Paramètres</a>
    </nav>
    <main id="view"></main>
  </div>
  <script>
    const org = document.body.dataset.org;
    const project = document.body.dataset.project;
    const user = document.body.dataset.user || "azurz";
    const root = "/" + org + "/" + project + "/_apis";
    const hub = location.pathname.replace("/" + org + "/" + project, "") || "/";
    document.querySelectorAll("nav a").forEach((link) => {
      if (link.getAttribute("href") === location.pathname) link.classList.add("active");
    });
    document.getElementById("crumb").textContent = org + " / " + (project || "Projets") + " · " + user;

    async function api(method, path, body, contentType) {
      const response = await fetch(path, {
        method,
        headers: body ? { "Content-Type": contentType || "application/json" } : {},
        body: body ? (typeof body === "string" ? body : JSON.stringify(body)) : undefined,
      });
      const text = await response.text();
      let data = null;
      try { data = JSON.parse(text); } catch (error) { data = { message: text }; }
      if (!response.ok) throw new Error(data.message || data.detail || text);
      return data;
    }
    function esc(value) {
      return String(value ?? "").replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
    }
    function stateClass(state) {
      const name = String(state || "New").toLowerCase();
      if (name === "active") return "state-active";
      if (name === "resolved") return "state-resolved";
      if (name === "closed") return "state-closed";
      return "state-new";
    }
    async function workItems() {
      const wiql = await api("POST", root + "/wit/wiql?api-version=7.1", {
        query: "SELECT [System.Id] FROM WorkItems",
      });
      const ids = (wiql.workItems || []).map((item) => item.id);
      if (!ids.length) return [];
      const page = await api("GET", root + "/wit/workitems?ids=" + ids.join(",") + "&api-version=7.1");
      return page.value || [];
    }
    function titleOf(item) { return item.fields?.["System.Title"] || "(sans titre)"; }
    function rows(items) {
      if (!items.length) return "<p class='sub'>Aucun élément de travail.</p>";
      return "<table><thead><tr><th>ID</th><th>Titre</th><th>Type</th><th>État</th></tr></thead><tbody>" +
        items.map((item) => "<tr class='click' data-id='" + item.id + "'><td>" + item.id + "</td><td>" + esc(titleOf(item)) + "</td><td class='type'>" + esc(item.fields?.["System.WorkItemType"]) + "</td><td><span class='pill " + stateClass(item.fields?.["System.State"]) + "'>" + esc(item.fields?.["System.State"] || "New") + "</span></td></tr>").join("") +
        "</tbody></table>";
    }
    async function openItem(id) {
      const item = await api("GET", root + "/wit/workitems/" + id + "?api-version=7.1");
      const fields = item.fields || {};
      const comments = await api("GET", root + "/wit/workItems/" + id + "/comments?api-version=7.1-preview.3");
      const panel = document.createElement("section");
      panel.className = "panel";
      const states = ["New", "Active", "Resolved", "Closed"].map((state) => "<option" + (state === fields["System.State"] ? " selected" : "") + ">" + state + "</option>").join("");
      const notes = (comments.comments || []).map((note) => "<li>" + esc(note.text) + "</li>").join("") || "<li>Aucun commentaire.</li>";
      const links = (item.relations || []).map((link) => "<li>" + esc(link.rel) + " " + esc(link.url) + "</li>").join("") || "<li>Aucun lien.</li>";
      panel.innerHTML = "<div class='form'><div><h2>#" + item.id + " " + esc(fields["System.WorkItemType"]) + "</h2>" +
        "<div class='row'><input id='wi-title' value='" + esc(fields["System.Title"] || "") + "' style='flex:1' />" +
        "<select id='wi-state'>" + states + "</select></div>" +
        "<textarea id='wi-desc' rows='6'>" + esc(fields["System.Description"] || "") + "</textarea>" +
        "<div class='command'><button id='wi-save' type='button'>Enregistrer</button></div>" +
        "<h3>Liens</h3><ul>" + links + "</ul></div>" +
        "<aside><h3>Discussion</h3><ul>" + notes + "</ul>" +
        "<div class='row'><input id='wi-note' placeholder='Commentaire' style='flex:1' /><button id='wi-comment' type='button'>Ajouter</button></div></aside></div>";
      document.getElementById("view").appendChild(panel);
      panel.querySelector("#wi-save").onclick = async () => {
        const patch = JSON.stringify([
          { op: "replace", path: "/fields/System.Title", value: panel.querySelector("#wi-title").value },
          { op: "replace", path: "/fields/System.State", value: panel.querySelector("#wi-state").value },
          { op: "replace", path: "/fields/System.Description", value: panel.querySelector("#wi-desc").value },
        ]);
        await api("PATCH", root + "/wit/workitems/" + id + "?api-version=7.1", patch, "application/json-patch+json");
        location.reload();
      };
      panel.querySelector("#wi-comment").onclick = async () => {
        await api("POST", root + "/wit/workItems/" + id + "/comments?api-version=7.1-preview.3", { text: panel.querySelector("#wi-note").value });
        location.reload();
      };
    }
    function bindRows() {
      document.querySelectorAll("tr.click").forEach((row) => { row.onclick = () => openItem(row.dataset.id); });
    }
    async function collection(area) {
      const data = await api("GET", root + "/" + area + "?api-version=7.1");
      return data.value || [];
    }
    async function render() {
      const view = document.getElementById("view");
      try {
        if (!project) {
          const data = await api("GET", "/" + org + "/_apis/projects?api-version=7.1");
          view.innerHTML = "<h1>Projets</h1><div class='cards'>" + (data.value || []).map((item) => "<a class='tile' href='/" + org + "/" + encodeURIComponent(item.name) + "'><b>" + esc(item.name) + "</b>" + esc(item.description || "") + "</a>").join("") + "</div>";
          return;
        }
        if (hub === "/" || hub === "") {
          const [items, repos, builds, plans, feeds] = await Promise.all([
            workItems(), collection("git/repositories"), collection("build/definitions"),
            collection("testplan/plans"), collection("packaging/feeds"),
          ]);
          view.innerHTML = "<h1>" + esc(project) + "</h1><p class='sub'>Vue d'ensemble</p><div class='command'><input id='search' placeholder='Rechercher un élément de travail' /><button id='search-go' type='button'>Rechercher</button></div><div id='search-result'></div><div class='cards'>" +
            "<div class='tile'><b>" + items.length + "</b>Éléments de travail</div>" +
            "<div class='tile'><b>" + repos.length + "</b>Dépôts</div>" +
            "<div class='tile'><b>" + builds.length + "</b>Pipelines</div>" +
            "<div class='tile'><b>" + plans.length + "</b>Plans de test</div>" +
            "<div class='tile'><b>" + feeds.length + "</b>Artefacts</div></div>";
          document.getElementById("search-go").onclick = async () => {
            const found = await api("POST", root + "/search/workitemsearchresults?api-version=7.1", { searchText: document.getElementById("search").value, $top: 25 });
            const rows = found.results || [];
            document.getElementById("search-result").innerHTML = rows.length ? "<ul>" + rows.map((row) => "<li>" + esc(row.fields?.["system.title"]) + "</li>").join("") + "</ul>" : "<p class='sub'>Aucun résultat.</p>";
          };
          return;
        }
        if (hub === "/_workitems" || hub === "/_backlogs" || hub === "/_sprints") {
          const items = await workItems();
          const heading = hub === "/_backlogs" ? "Backlogs" : hub === "/_sprints" ? "Sprints" : "Éléments de travail";
          view.innerHTML = "<h1>" + heading + "</h1><div class='command'><select id='kind'><option>User Story</option><option>Bug</option><option>Task</option><option>Feature</option><option>Epic</option></select><input id='new-title' placeholder='Titre' /><button id='create' type='button'>Nouvel élément de travail</button></div>" + rows(items);
          bindRows();
          document.getElementById("create").onclick = async () => {
            const kind = document.getElementById("kind").value;
            const title = document.getElementById("new-title").value || "Sans titre";
            const patch = JSON.stringify([{ op: "add", path: "/fields/System.Title", value: title }]);
            await api("POST", root + "/wit/workitems/$" + encodeURIComponent(kind) + "?api-version=7.1", patch, "application/json-patch+json");
            location.reload();
          };
          return;
        }
        if (hub === "/_boards") {
          const items = await workItems();
          const columns = ["New", "Active", "Resolved", "Closed"];
          view.innerHTML = "<h1>Tableaux</h1><p class='sub'>Glisser une carte change l'état, comme sur un board.</p><div class='board'>" + columns.map((state) => {
            const cards = items.filter((item) => (item.fields?.["System.State"] || "New") === state).map((item) => "<article class='card' draggable='true' data-id='" + item.id + "'><b>#" + item.id + "</b><div>" + esc(titleOf(item)) + "</div></article>").join("") || "<p class='sub empty'>Vide</p>";
            return "<section class='col' data-state='" + state + "'><h2>" + state + "</h2>" + cards + "</section>";
          }).join("") + "</div>";
          document.querySelectorAll(".card").forEach((card) => {
            card.ondragstart = (event) => event.dataTransfer.setData("text/plain", card.dataset.id);
            card.onclick = () => openItem(card.dataset.id);
          });
          document.querySelectorAll(".col").forEach((column) => {
            column.ondragover = (event) => { event.preventDefault(); column.classList.add("drop"); };
            column.ondragleave = () => column.classList.remove("drop");
            column.ondrop = async (event) => {
              event.preventDefault();
              column.classList.remove("drop");
              const id = event.dataTransfer.getData("text/plain");
              const card = document.querySelector(".card[data-id='" + id + "']");
              if (!card) return;
              const patch = JSON.stringify([{ op: "replace", path: "/fields/System.State", value: column.dataset.state }]);
              await api("PATCH", root + "/wit/workitems/" + id + "?api-version=7.1", patch, "application/json-patch+json");
              const empty = column.querySelector(".empty");
              if (empty) empty.remove();
              column.appendChild(card);
            };
          });
          return;
        }
        if (hub === "/_queries") {
          view.innerHTML = "<h1>Requêtes</h1><textarea id='wiql' rows='4'>SELECT [System.Id] FROM WorkItems WHERE [System.State] = 'New'</textarea><div class='command'><button id='run' type='button'>Exécuter</button></div><div id='result'></div>";
          document.getElementById("run").onclick = async () => {
            const found = await api("POST", root + "/wit/wiql?api-version=7.1", { query: document.getElementById("wiql").value });
            const ids = (found.workItems || []).map((item) => item.id);
            const page = ids.length ? await api("GET", root + "/wit/workitems?ids=" + ids.join(",") + "&api-version=7.1") : { value: [] };
            document.getElementById("result").innerHTML = rows(page.value || []);
            bindRows();
          };
          return;
        }
        if (hub === "/_git") {
          const repos = await collection("git/repositories");
          const repo = repos[0];
          let files = [];
          if (repo) {
            const page = await api("GET", root + "/git/repositories/" + encodeURIComponent(repo.id) + "/items?recursionLevel=Full&api-version=7.1");
            files = page.value || [];
          }
          const table = files.length ? "<table><thead><tr><th>Chemin</th><th>Type</th></tr></thead><tbody>" + files.map((item) => "<tr class='file' data-path='" + esc(item.path) + "'><td>" + esc(item.path) + "</td><td>" + esc(item.gitObjectType) + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Dépôt vide.</p>";
          view.innerHTML = "<h1>Fichiers</h1><p class='sub'>" + esc(repo ? repo.name + " · " + (repo.defaultBranch || "") : "Aucun dépôt") + "</p>" + table + "<section id='file' class='panel' hidden></section>";
          document.querySelectorAll("tr.file").forEach((row) => {
            row.onclick = async () => {
              if (!repo || row.dataset.path === "/") return;
              const item = await api("GET", root + "/git/repositories/" + encodeURIComponent(repo.id) + "/items?path=" + encodeURIComponent(row.dataset.path) + "&api-version=7.1");
              const panel = document.getElementById("file");
              panel.hidden = false;
              panel.innerHTML = "<h2>" + esc(item.path) + "</h2><pre>" + esc(item.content || "") + "</pre>";
            };
          });
          return;
        }
        if (hub === "/_git/pulls") {
          const pulls = await collection("git/pullrequests");
          const table = pulls.length ? "<table><thead><tr><th>ID</th><th>Titre</th><th>État</th><th>Source</th><th>Cible</th></tr></thead><tbody>" + pulls.map((item) => "<tr class='click pr' data-id='" + esc(item.pullRequestId || item.id) + "' data-repo='" + esc(item.repository?.id || "") + "'><td>" + esc(item.pullRequestId || item.id) + "</td><td>" + esc(item.title || item.name) + "</td><td>" + esc(item.status) + "</td><td>" + esc(item.sourceRefName) + "</td><td>" + esc(item.targetRefName) + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucune demande de tirage.</p>";
          view.innerHTML = "<h1>Demandes de tirage</h1><div class='command'><input id='pr-title' placeholder='Titre' /><input id='pr-source' placeholder='refs/heads/feature' /><button id='create' type='button'>Nouvelle demande de tirage</button></div>" + table + "<section id='thread' class='panel' hidden></section>";
          document.querySelectorAll("tr.pr").forEach((row) => {
            row.onclick = async () => {
              const repos = await collection("git/repositories");
              const repoId = row.dataset.repo || (repos[0] && repos[0].id);
              const threads = await api("GET", root + "/git/repositories/" + encodeURIComponent(repoId) + "/pullrequests/" + row.dataset.id + "/threads?api-version=7.1");
              const panel = document.getElementById("thread");
              panel.hidden = false;
              const notes = (threads.value || []).flatMap((thread) => thread.comments || []).map((note) => "<li>" + esc(note.content) + "</li>").join("") || "<li>Aucun commentaire.</li>";
              panel.innerHTML = "<h2>Discussion</h2><ul>" + notes + "</ul><div class='row'><input id='thread-note' placeholder='Commentaire' style='flex:1' /><button id='thread-add' type='button'>Ajouter</button></div>";
              panel.querySelector("#thread-add").onclick = async () => {
                await api("POST", root + "/git/repositories/" + encodeURIComponent(repoId) + "/pullrequests/" + row.dataset.id + "/threads?api-version=7.1", { comments: [{ content: panel.querySelector("#thread-note").value }], status: "active" });
                row.click();
              };
            };
          });
          document.getElementById("create").onclick = async () => {
            const repos = await collection("git/repositories");
            const repo = repos[0];
            if (!repo) return;
            await api("POST", root + "/git/repositories/" + encodeURIComponent(repo.id) + "/pullrequests?api-version=7.1", {
              title: document.getElementById("pr-title").value || "Demande de tirage",
              sourceRefName: document.getElementById("pr-source").value || "refs/heads/feature",
              targetRefName: "refs/heads/main",
            });
            location.reload();
          };
          return;
        }
        if (hub === "/_build") {
          const [definitions, builds] = await Promise.all([collection("build/definitions"), collection("build/builds")]);
          const defs = definitions.length ? "<table><thead><tr><th>ID</th><th>Pipeline</th><th>File</th></tr></thead><tbody>" + definitions.map((item) => "<tr><td>" + esc(item.id) + "</td><td>" + esc(item.name) + "</td><td>" + esc(item.queueStatus) + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucun pipeline.</p>";
          const runs = builds.length ? "<table><thead><tr><th>Build</th><th>Numéro</th><th>État</th><th>Résultat</th></tr></thead><tbody>" + builds.map((item) => "<tr class='click build' data-id='" + esc(item.id) + "'><td>" + esc(item.id) + "</td><td>" + esc(item.buildNumber) + "</td><td>" + esc(item.status) + "</td><td>" + esc(item.result || "") + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucune exécution.</p>";
          view.innerHTML = "<h1>Pipelines</h1><div class='command'><button id='queue' type='button'>Mettre en file d'attente</button></div>" + defs + "<h2>Exécutions</h2>" + runs + "<pre id='log' class='panel' hidden></pre>";
          document.querySelectorAll("tr.build").forEach((row) => {
            row.onclick = async () => {
              const response = await fetch(root + "/build/builds/" + row.dataset.id + "/logs/1?api-version=7.1");
              const log = document.getElementById("log");
              log.hidden = false;
              log.textContent = await response.text();
            };
          });
          document.getElementById("queue").onclick = async () => {
            const definition = definitions[0];
            if (!definition) return;
            await api("POST", root + "/build/builds?api-version=7.1", { definition: { id: definition.id }, sourceBranch: "refs/heads/main" });
            location.reload();
          };
          return;
        }
        if (hub === "/_tfvc") {
          const [changesets, items] = await Promise.all([
            collection("tfvc/changesets"),
            api("GET", root + "/tfvc/items?path=$/&recursionLevel=Full&api-version=7.1").then((data) => data.value || []),
          ]);
          const files = items.length ? "<ul>" + items.map((item) => "<li>" + esc(item.path) + "</li>").join("") + "</ul>" : "<p class='sub'>Aucun fichier.</p>";
          const table = changesets.length ? "<table><thead><tr><th>ID</th><th>Commentaire</th></tr></thead><tbody>" + changesets.map((item) => "<tr><td>" + esc(item.changesetId || item.id) + "</td><td>" + esc(item.comment) + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucun changeset.</p>";
          view.innerHTML = "<h1>TFVC</h1><div class='command'><input id='cs-comment' placeholder='Commentaire' /><button id='checkin' type='button'>Archiver</button></div>" + files + table;
          document.getElementById("checkin").onclick = async () => {
            const comment = document.getElementById("cs-comment").value || "Archivage";
            await api("POST", root + "/tfvc/changesets?api-version=7.1", { comment, changes: [{ changeType: "add", item: { path: "$/" + comment.replace(/\s+/g, "-") + ".txt", content: comment } }] });
            location.reload();
          };
          return;
        }
        if (hub === "/_testPlans") {
          const plans = await collection("testplan/plans");
          const table = plans.length ? "<table><thead><tr><th>ID</th><th>Nom</th><th>État</th><th>Zone</th></tr></thead><tbody>" + plans.map((item) => "<tr><td>" + esc(item.id) + "</td><td>" + esc(item.name) + "</td><td>" + esc(item.state) + "</td><td>" + esc(item.areaPath) + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucun plan.</p>";
          view.innerHTML = "<h1>Plans de test</h1><div class='command'><input id='plan-name' placeholder='Nouveau plan' /><button id='create' type='button'>Créer</button></div>" + table;
          document.getElementById("create").onclick = async () => {
            await api("POST", root + "/testplan/plans?api-version=7.1", { name: document.getElementById("plan-name").value || "Plan" });
            location.reload();
          };
          return;
        }
        if (hub === "/_artifacts") {
          const feeds = await collection("packaging/feeds");
          const table = feeds.length ? "<table><thead><tr><th>Nom</th><th>Nom complet</th><th>Protocole</th></tr></thead><tbody>" + feeds.map((item) => "<tr><td>" + esc(item.name) + "</td><td>" + esc(item.fullyQualifiedName || item.name) + "</td><td>NuGet, npm</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucun flux.</p>";
          view.innerHTML = "<h1>Artefacts</h1><div class='command'><input id='feed-name' placeholder='Nouveau flux' /><button id='create' type='button'>Créer</button></div>" + table;
          document.getElementById("create").onclick = async () => {
            await api("POST", root + "/packaging/feeds?api-version=7.1", { name: document.getElementById("feed-name").value || "flux" });
            location.reload();
          };
          return;
        }
        if (hub === "/_wiki") {
          const wikis = await collection("wiki/wikis");
          const wiki = wikis[0];
          let pages = [];
          if (wiki) {
            const listed = await api("GET", root + "/wiki/wikis/" + encodeURIComponent(wiki.id) + "/pages?api-version=7.1");
            pages = listed.value || [];
          }
          const list = pages.length ? "<ul id='pages'>" + pages.map((page) => "<li><button type='button' class='page' data-path='" + esc(page.path) + "'>" + esc(page.path) + "</button></li>").join("") + "</ul>" : "<p class='sub'>Aucune page.</p>";
          view.innerHTML = "<h1>Wiki</h1><p class='sub'>" + esc(wiki ? wiki.name : "Aucun wiki") + "</p><div class='command'><input id='wiki-name' placeholder='Nouveau wiki' /><button id='wiki-create' type='button'>Créer le wiki</button></div><div class='command'><input id='page-path' placeholder='/Accueil' /><button id='page-load' type='button'>Ouvrir</button></div>" + list + "<textarea id='page-content' rows='10'></textarea><div class='command'><button id='page-save' type='button'>Enregistrer la page</button></div>";
          async function loadPage(path) {
            if (!wiki) return;
            document.getElementById("page-path").value = path;
            const page = await api("GET", root + "/wiki/wikis/" + encodeURIComponent(wiki.id) + "/pages?path=" + encodeURIComponent(path) + "&api-version=7.1");
            document.getElementById("page-content").value = page.content || "";
          }
          document.querySelectorAll("button.page").forEach((button) => { button.onclick = () => loadPage(button.dataset.path); });
          document.getElementById("page-load").onclick = () => loadPage(document.getElementById("page-path").value || "/Accueil");
          document.getElementById("wiki-create").onclick = async () => {
            await api("POST", root + "/wiki/wikis?api-version=7.1", { name: document.getElementById("wiki-name").value || (project + ".wiki") });
            location.reload();
          };
          document.getElementById("page-save").onclick = async () => {
            let current = wiki;
            if (!current) {
              current = await api("POST", root + "/wiki/wikis?api-version=7.1", { name: document.getElementById("wiki-name").value || (project + ".wiki") });
            }
            const path = document.getElementById("page-path").value || "/Accueil";
            await api("PUT", root + "/wiki/wikis/" + encodeURIComponent(current.id) + "/pages?path=" + encodeURIComponent(path) + "&api-version=7.1", { content: document.getElementById("page-content").value });
            location.reload();
          };
          return;
        }
        if (hub === "/_library") {
          const groups = await collection("distributedtask/variablegroups");
          const table = groups.length ? "<table><thead><tr><th>Nom</th><th>Type</th><th>Variables</th></tr></thead><tbody>" + groups.map((item) => {
            const variables = item.variables || {};
            const shown = Object.keys(variables).map((key) => key + "=" + (variables[key].value || "")).join(", ");
            return "<tr><td>" + esc(item.name) + "</td><td>" + esc(item.type) + "</td><td>" + esc(shown) + "</td></tr>";
          }).join("") + "</tbody></table>" : "<p class='sub'>Aucun groupe de variables.</p>";
          view.innerHTML = "<h1>Bibliothèque</h1><div class='command'><input id='vg-name' placeholder='Groupe' /><input id='vg-key' placeholder='Variable' /><input id='vg-value' placeholder='Valeur' /><button id='create' type='button'>Créer</button></div>" + table;
          document.getElementById("create").onclick = async () => {
            const key = document.getElementById("vg-key").value || "CLE";
            const variables = {};
            variables[key] = { value: document.getElementById("vg-value").value || "", isSecret: false };
            await api("POST", root + "/distributedtask/variablegroups?api-version=7.1", {
              name: document.getElementById("vg-name").value || "Groupe",
              type: "Vsts",
              variables,
            });
            location.reload();
          };
          return;
        }
        const catalogs = {
          "/_git/commits": ["Commits", "git/commits", "comment", "Nouveau commit"],
          "/_git/pushes": ["Poussées", "git/pushes", "refName", "Nouvelle poussée"],
          "/_git/branches": ["Branches", "git/refs", "name", "refs/heads/"],
          "/_environments": ["Environnements", "distributedtask/environments", "name", "Nouvel environnement"],
          "/_release": ["Versions", "release/releases", "name", "Nouvelle version"],
          "/_testPlans/runs": ["Exécutions", "test/runs", "name", "Nouvelle exécution"],
        };
        if (catalogs[hub]) {
          const heading = catalogs[hub][0];
          const area = catalogs[hub][1];
          const field = catalogs[hub][2];
          const label = catalogs[hub][3];
          const items = await collection(area);
          const table = items.length ? "<table><thead><tr><th>ID</th><th>Nom</th></tr></thead><tbody>" + items.map((item) => "<tr><td>" + esc(item.id) + "</td><td>" + esc(item[field] || item.name || item.title || "") + "</td></tr>").join("") + "</tbody></table>" : "<p class='sub'>Aucun enregistrement.</p>";
          view.innerHTML = "<h1>" + heading + "</h1><div class='command'><input id='new-name' placeholder='" + esc(label) + "' /><button id='create' type='button'>Créer</button></div>" + table;
          document.getElementById("create").onclick = async () => {
            const name = document.getElementById("new-name").value || label;
            const payload = {};
            payload[field] = name;
            payload.name = name;
            await api("POST", root + "/" + area + "?api-version=7.1", payload);
            location.reload();
          };
          return;
        }
        if (hub === "/_settings") {
          const areas = await api("GET", "/_apis/resourceAreas?api-version=7.1");
          view.innerHTML = "<h1>Paramètres</h1><p class='sub'>API REST 7.1. Le jeton se saisit comme mot de passe, avec n'importe quel nom d'utilisateur.</p><ul>" + (areas.value || []).map((area) => "<li><code>" + esc(area.id) + "</code> — " + esc(area.locationUrl) + "</li>").join("") + "</ul>";
          return;
        }
        view.innerHTML = "<h1>Azure DevOps</h1><p class='sub'>Cette page n'a pas encore de vue dédiée. Les API correspondantes répondent sous /_apis.</p>";
      } catch (error) {
        view.innerHTML = "<h1>Azure DevOps</h1><p class='error'>" + esc(error.message) + "</p>";
      }
    }
    render();
  </script>
</body>
</html>
